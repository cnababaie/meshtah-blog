version: "3.9"

services:
  strapi:
    working_dir: /app
    build: ./meshtah-strapi-back
    volumes:
    - ./meshtah-strapi-back/.tmp:/app/.tmp
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=4096"
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: /app/.tmp/data.db
      PUBLIC_URL: https://api.meshtah.net
    restart: unless-stopped
    networks:
      - internal

  next:
    build: ./meshtah-next-front
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_STRAPI_URL: https://api.meshtah.net
    depends_on:
      - strapi
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - next
      - strapi
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge