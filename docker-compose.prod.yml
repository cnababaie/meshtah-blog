version: "3.9"

services:
  strapi:
    working_dir: /app
    build: ./meshtah-strapi-back
    volumes:
      - ./meshtah-strapi-back/.tmp:/app/.tmp
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=4096"
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: /app/.tmp/data.db
      PUBLIC_URL: https://meshtah.net

    restart: unless-stopped
    networks:
      - internal

  next:
    build: ./meshtah-next-front
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_STRAPI_URL: https://meshtah.net
    ports:                  
      - "3000:3000"        
    expose:
      - "3000"             
    depends_on:
      - strapi
    restart: unless-stopped
    networks:
      - internal

  # ←←←←←←←←←  NEW CADDY SERVICE  →→→→→→→→→
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro          # ← you will create this file
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - next
      - strapi
    networks:
      - internal

networks:
  internal:
    driver: bridge

# Persistent volumes for certificates and config so you don’t re-issue certs every time
volumes:
  caddy_data:
  caddy_config:
