version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    env_file:
      - ./meshtah-strapi-back/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  strapi:
    build: ./meshtah-strapi-back
    container_name: strapi
    restart: unless-stopped
    env_file:
      - ./meshtah-strapi-back/.env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=4096"
      PUBLIC_URL: https://meshtah.net
      ADMIN_URL: https://meshtah.net/admin
      STRAPI_ENABLE_PROXY: "true"
      COOKIE_DOMAIN: meshtah.net
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
    volumes:
      - strapi_uploads:/app/public/uploads
    depends_on:
      - postgres
    networks:
      - internal

  next:
    build: ./meshtah-next-front
    container_name: next
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_STRAPI_URL: https://meshtah.net
    ports:
      - "3000:3000"
    expose:
      - "3000"
    depends_on:
      - strapi
    networks:
      - internal

  nginx:
    image: nginx:stable
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - next
      - strapi
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/upstream.conf:/etc/nginx/conf.d/upstream.conf:ro
      - ./nginx/strapi.conf:/etc/nginx/conf.d/strapi.conf:ro

      - /etc/letsencrypt:/etc/letsencrypt:ro

      - strapi_uploads:/strapi_uploads:ro
    networks:
      - internal


networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  strapi_uploads:
