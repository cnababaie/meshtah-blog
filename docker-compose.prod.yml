version: "3.9"

services:
  strapi:
    build: ./meshtah-strapi-back
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=4096"
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: /app/.tmp/data.db
      HOST: 0.0.0.0
      PORT: 80
      PUBLIC_URL: https://meshtah.net
    volumes:
      - ./meshtah-strapi-back:/app
      - ./meshtah-strapi-back/.tmp:/app/.tmp
      - /app/node_modules
    expose:
      - "80"
    restart: unless-stopped

  next:
    build: ./meshtah-next-front
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_STRAPI_URL: https://meshtah.net
    volumes:
      - ./meshtah-next-front/.next:/app/.next
      - /app/node_modules
    expose:
      - "3000"
    restart: unless-stopped

  reverse-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/letsencrypt:ro
      - ./proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - strapi
      - next
    restart: unless-stopped