server {
    listen 80;
    listen [::]:80;
    server_name meshtah.net www.meshtah.net api.meshtah.net;

    # Redirect all http → https
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meshtah.net www.meshtah.net;

    ssl_certificate     /etc/letsencrypt/live/meshtah.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meshtah.net/privkey.pem;

    # Next.js frontend
    location / {
        proxy_pass http://next:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.meshtah.net;

    ssl_certificate     /etc/letsencrypt/live/meshtah.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meshtah.net/privkey.pem;

    # Strapi backend
    location / {
        proxy_pass http://strapi:1337;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
