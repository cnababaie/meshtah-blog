server {
    listen 80;
    listen [::]:80;
    server_name meshtah.net www.meshtah.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meshtah.net www.meshtah.net;

    ssl_certificate     /etc/letsencrypt/live/meshtah.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meshtah.net/privkey.pem;

    location / {
        proxy_pass http://next:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://strapi:1337/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://strapi:1337/uploads/;
    }
}
